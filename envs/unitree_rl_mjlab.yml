# Training env (mjlab + rsl_rl on the GPU). Versions = the ones Phase 3b/4 trained with.
# make envs creates it, then pip-installs the unitree_rl_mjlab checkout (editable).
name: unitree_rl_mjlab
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - mjlab==1.2.0
      - mujoco==3.5.0
      - mujoco-warp==3.5.0
      - warp-lang==1.12.0
      - rsl-rl-lib==5.0.1
      - onnx==1.23.2
      - tensorboard
